version: 2
sources:
  - name: wh
    description: "Warehouse tables loaded from the Silver layer by fbplatform.warehouse.load (PostgreSQL schema wh)."
    schema: wh
    tables:
      - name: dim_competition
        columns:
          - {name: competition_key, tests: [unique, not_null]}
          - {name: competition_id, tests: [unique, not_null, {accepted_values: {values: ['WC', 'EURO', 'COPA', 'UNL']}}]}
      - name: dim_season
        columns:
          - {name: season_key, tests: [unique, not_null]}
          - {name: season_id, tests: [unique, not_null]}
          - name: competition_key
            tests: [{relationships: {to: "source('wh', 'dim_competition')", field: competition_key}}]
      - name: dim_team
        columns:
          - {name: team_key, tests: [unique, not_null]}
          - {name: team_id, tests: [unique, not_null]}
      - name: dim_player
        columns:
          - {name: player_key, tests: [unique, not_null]}
          - {name: player_id, tests: [unique, not_null]}
      - name: dim_venue
        columns:
          - {name: venue_key, tests: [unique, not_null]}
      - name: dim_referee
        columns:
          - {name: referee_key, tests: [unique, not_null]}
      - name: dim_date
        columns:
          - {name: date_key, tests: [unique, not_null]}
      - name: dim_tournament_stage
        columns:
          - {name: stage_key, tests: [unique, not_null]}
          - name: stage_name
            tests: [{accepted_values: {values: ['Group stage', 'Play-off', 'Promotion/relegation play-off', 'Round of 32', 'Round of 16', 'Quarter-finals', 'Semi-finals', 'Third place', 'Final']}}]
      - name: fact_matches
        columns:
          - {name: match_key, tests: [unique, not_null]}
          - {name: match_id, tests: [unique, not_null]}
          - name: season_key
            tests: [not_null, {relationships: {to: "source('wh', 'dim_season')", field: season_key}}]
          - name: home_team_key
            tests: [{relationships: {to: "source('wh', 'dim_team')", field: team_key}}]
          - name: away_team_key
            tests: [{relationships: {to: "source('wh', 'dim_team')", field: team_key}}]
          - name: venue_key
            tests: [{relationships: {to: "source('wh', 'dim_venue')", field: venue_key}}]
          - name: match_status
            tests: [not_null, {accepted_values: {values: ['completed', 'scheduled']}}]
          - {name: attendance, tests: [{non_negative: {}}]}
      - name: fact_match_events
        columns:
          - {name: event_key, tests: [unique, not_null]}
          - name: match_key
            tests: [not_null, {relationships: {to: "source('wh', 'fact_matches')", field: match_key}}]
          - name: player_key
            tests: [{relationships: {to: "source('wh', 'dim_player')", field: player_key}}]
      - name: fact_player_appearances
        columns:
          - {name: appearance_key, tests: [unique, not_null]}
          - name: match_key
            tests: [not_null, {relationships: {to: "source('wh', 'fact_matches')", field: match_key}}]
      - name: fact_player_match_stats
      - name: fact_team_match_stats
      - name: fact_tournament_standings
      - name: fact_player_awards
      - name: fact_team_awards
